name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  format-check:
    name: clang-format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        run: find src test -\( -name '*.h' -o -name '*.cpp' -\) | xargs clang-format --dry-run --Werror

  test:
    name: Tests
    runs-on: ubuntu-latest
    container: debian:trixie

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates build-essential cmake \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-base-private-dev \
            qt6-declarative-dev \
            qt6-declarative-dev-tools \
            qt6-declarative-private-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-tools-private-dev \
            qt6-location-dev \
            qt6-positioning-dev \
            qt6-positioning-private-dev

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix git safe directory
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DDISABLE_TESTS=OFF

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

  build-deb:
    name: .deb (Debian Trixie)
    needs: [format-check, test]
    runs-on: ubuntu-latest
    container: debian:trixie

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates build-essential cmake \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-base-private-dev \
            qt6-declarative-dev \
            qt6-declarative-dev-tools \
            qt6-declarative-private-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            qt6-tools-private-dev \
            qt6-location-dev \
            qt6-positioning-dev \
            qt6-positioning-private-dev

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix git safe directory
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build .deb package
        run: ./build-deb.sh

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: yangl-deb
          path: debbuild/*.deb

  build-rpm:
    name: .rpm (Fedora 42)
    needs: [format-check, test]
    runs-on: ubuntu-latest
    container: fedora:42

    steps:
      - name: Install dependencies
        run: |
          dnf install -y \
            gcc-c++ make cmake git rpm-build \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel \
            qt6-qttools-devel \
            qt6-qtlocation-devel \
            qt6-qtpositioning-devel

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix git safe directory
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build .rpm package
        run: ./build-rpm.sh

      - name: Upload .rpm
        uses: actions/upload-artifact@v4
        with:
          name: yangl-rpm
          path: rpmbuild/*.rpm

  build-appimage:
    name: AppImage
    needs: [format-check, test]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtlocation qtpositioning'
          cache: true

      - name: Build AppImage
        run: ./build-appimage.sh --qt-dir "$QT_ROOT_DIR"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: yangl-appimage
          path: appimagebuild/*.AppImage
